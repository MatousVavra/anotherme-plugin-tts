<div class="tts-component" style="display:none;" x-data="ttsComponent()">
    <div class="tts-pill" x-cloak x-show="state !== 'idle'" @click="stop()" role="button" tabindex="0"
         @keydown.enter.prevent="stop()" aria-label="Stop speech">
        <span class="tts-pill-spinner" x-show="state === 'synthesizing'" aria-hidden="true"></span>
        <svg x-show="state === 'playing'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <span class="tts-pill-label" x-text="state === 'synthesizing' ? 'Synthesizing…' : 'Speaking…'"></span>
        <span class="tts-pill-hint">click to stop</span>
    </div>
</div>
